<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#142b3b"><link rel="manifest" href="manifest.json">
<title>النسر للتجارة</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#172b3a;--muted:#71808b;--brand:#142b3b;--accent:#d7a94b;--line:#e4eaee;--red:#b83b3b;--green:#18794e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:var(--brand);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{color:#d5e0e6}.wrap{max-width:1250px;margin:auto;padding:16px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.nav button,.btn{border:0;border-radius:9px;padding:10px 13px;background:#e5ebef;color:var(--ink);cursor:pointer;font-weight:600}.nav button.active,.btn.primary{background:var(--brand);color:white}.btn.gold{background:var(--accent);color:#1b2730}.btn.danger{background:#fae5e5;color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,form,.tablebox{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:13px}.metric strong{font-size:24px;display:block;margin-top:8px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:145px;flex:1;margin-bottom:9px}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid #d8e0e5;border-radius:8px;background:white;font:inherit;color:var(--ink)}textarea{min-height:70px}h2{font-size:19px;margin:5px 0 14px}h3{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7f9fa;color:#53636e}.tablebox{overflow:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{padding:12px;border-radius:9px;background:#fff6df;color:#72531b;font-size:13px;margin-bottom:12px}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none!important}.right{margin-right:auto}.tag{display:inline-block;background:#edf2f5;border-radius:20px;padding:4px 8px;font-size:12px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.foot{font-size:12px;color:var(--muted);padding:15px;text-align:center}@media(max-width:600px){header{padding:13px}.wrap{padding:10px}.nav button{flex:1 0 30%;font-size:12px}.field{min-width:100%}}
@media print{header,.nav,.no-print,form,.foot{display:none!important}body{background:white}.panel{display:none!important}#invoices.panel.active{display:block!important}.wrap{max-width:none;padding:0}.card,.tablebox{border:0}}
</style></head>
<body>
<header><div><h1 id="brandTitle">النسر للتجارة</h1><small>نظام إدارة النشاط والمخزون والحسابات</small></div><div id="today"></div></header>
<div class="wrap">
<div class="notice">نسخة تشغيل أولية متكاملة الوظائف الأساسية. البيانات محفوظة محليًا على هذا المتصفح والجهاز. اعمل نسخة احتياطية بانتظام، ولا تعتمد عليها تجاريًا قبل اختبارها ومراجعتها.</div>
<nav class="nav no-print" id="nav"></nav>
<section id="dashboard" class="panel active"></section>
<section id="products" class="panel"></section>
<section id="customers" class="panel"></section>
<section id="suppliers" class="panel"></section>
<section id="purchases" class="panel"></section>
<section id="sales" class="panel"></section>
<section id="expenses" class="panel"></section>
<section id="cash" class="panel"></section>
<section id="reports" class="panel"></section>
<section id="invoices" class="panel"></section>
<section id="settings" class="panel"></section>
<div class="foot">Al Nesr Trading • يعمل محليًا دون خادم • العملة: الجنيه المصري</div>
</div>
<script>
const $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م', today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const keys=['products','customers','suppliers','purchases','sales','expenses','movements','cash','settings','invoices'];
let db={}; keys.forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem('alnesr_'+k))||[]}catch{db[k]=[]}});
if(!db.settings.length)db.settings=[{name:'النسر للتجارة',phone:'',address:'',password:'1234',locked:false}];
let activeInvoice=null;
function save(){keys.forEach(k=>localStorage.setItem('alnesr_'+k,JSON.stringify(db[k])));renderDashboard()}
function cfg(){return db.settings[0]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const navItems=[['dashboard','الرئيسية'],['products','المنتجات والمخزون'],['customers','العملاء'],['suppliers','الموردون'],['purchases','المشتريات'],['sales','المبيعات'],['expenses','المصروفات'],['cash','الخزنة'],['reports','التقارير'],['invoices','الفواتير'],['settings','الإعدادات']];
$('#nav').innerHTML=navItems.map(([id,n],i)=>`<button class="${i===0?'active':''}" data-go="${id}">${n}</button>`).join('');
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(!b)return;show(b.dataset.go)});
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));render(id)}
function render(id){({dashboard:renderDashboard,products:renderProducts,customers:()=>renderPeople('customers'),suppliers:()=>renderPeople('suppliers'),purchases:renderPurchases,sales:renderSales,expenses:renderExpenses,cash:renderCash,reports:renderReports,invoices:renderInvoices,settings:renderSettings}[id]||(()=>{}))()}
function metric(label,value){return `<div class="card metric"><span class="muted">${label}</span><strong>${value}</strong></div>`}
function renderDashboard(){let sales=db.sales.reduce((s,x)=>s+x.total,0), paid=db.sales.reduce((s,x)=>s+x.paid,0), cost=db.sales.reduce((s,x)=>s+x.cost,0), exp=db.expenses.reduce((s,x)=>s+x.amount,0), stock=db.products.reduce((s,p)=>s+p.qty*p.cost,0), debt=db.sales.reduce((s,x)=>s+x.due,0), low=db.products.filter(p=>p.qty<=p.min).length;
$('#brandTitle').textContent=cfg().name;$('#today').textContent=new Date().toLocaleDateString('ar-EG');
$('#dashboard').innerHTML=`<h2>ملخص النشاط</h2><div class="grid">${metric('إجمالي المبيعات',money(sales))}${metric('التحصيل الفعلي',money(paid))}${metric('تكلفة البضاعة المباعة',money(cost))}${metric('الربح الإجمالي',money(sales-cost))}${metric('المصروفات',money(exp))}${metric('صافي الربح التقديري',money(sales-cost-exp))}${metric('قيمة المخزون بالتكلفة',money(stock))}${metric('ديون العملاء',money(debt))}${metric('منتجات وصلت حد التنبيه',low)}</div><div class="card"><h3>تنبيهات المخزون</h3>${low?db.products.filter(p=>p.qty<=p.min).map(p=>`<p>${esc(p.name)} — المتاح ${p.qty} / الحد ${p.min}</p>`).join(''):'لا توجد منتجات تحت حد التنبيه.'}</div>`}
function renderProducts(){$('#products').innerHTML=`<h2>المنتجات والمخزون</h2><form id="productForm"><h3>إضافة / تعديل منتج</h3><input type="hidden" name="id"><div class="row">${field('name','اسم المنتج',true)}${field('code','الكود')}${field('category','التصنيف')}${field('cost','متوسط تكلفة الشراء','number')}${field('wholesale','سعر الجملة','number')}${field('retail','سعر القطاعي','number')}${field('qty','الكمية الحالية','number')}${field('min','حد التنبيه','number')}</div><div class="row">${field('warranty','الضمان: بدون/بضمان')}${field('warrantyBy','جهة الضمان')}${field('image','رابط صورة المنتج')}${field('specs','المواصفات والملاحظات')}</div><button class="btn primary">حفظ المنتج</button></form><form id="movementForm"><h3>حركة مخزون يدوية</h3><div class="row"><div class="field"><label>المنتج</label><select name="product" required>${productOptions()}</select></div><div class="field"><label>نوع الحركة</label><select name="type"><option value="in">إضافة</option><option value="out">خصم</option><option value="damage">تالف</option><option value="lost">مفقود</option></select></div>${field('qty','الكمية','number')}${field('note','ملاحظات')}</div><button class="btn">تسجيل الحركة</button></form><div class="tablebox"><table><thead><tr><th>المنتج</th><th>الكود</th><th>الكمية</th><th>التكلفة</th><th>جملة</th><th>قطاعي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.code)}</td><td>${p.qty}</td><td>${money(p.cost)}</td><td>${money(p.wholesale)}</td><td>${money(p.retail)}</td><td>${p.qty<=p.min?'<span class="bad">منخفض</span>':'متاح'}</td><td><button class="btn small" onclick="editProduct('${p.id}')">تعديل</button> <button class="btn small danger" onclick="del('products','${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`;
$('#productForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let old=db.products.find(x=>x.id===f.id);let p={...old,...f,id:f.id||uid(),cost:+f.cost||0,wholesale:+f.wholesale||0,retail:+f.retail||0,qty:+f.qty||0,min:+f.min||0};if(old&&p.qty!==old.qty)move(p.id,p.qty-old.qty,'تعديل رصيد افتتاحي');if(!old)db.movements.push({id:uid(),product:p.id,date:today(),type:'opening',qty:p.qty,note:'رصيد افتتاحي'});db.products=old?db.products.map(x=>x.id===p.id?p:x):[p,...db.products];save();renderProducts()};
$('#movementForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let p=db.products.find(x=>x.id===f.product),q=+f.qty;if(!p||q<=0)return alert('راجع المنتج والكمية');if(['out','damage','lost'].includes(f.type)&&p.qty<q)return alert('الكمية غير كافية');p.qty+=f.type==='in'?q:-q;db.movements.push({id:uid(),product:p.id,date:today(),type:f.type,qty:q,note:f.note});save();renderProducts()}}
function field(name,label,type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type==='number'?'number':'text'}" ${type==='number'?'step="0.01" min="0"':''} ${required?'required':''}></div>`}
function productOptions(){return db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.qty})</option>`).join('')}
function editProduct(id){let p=db.products.find(x=>x.id===id),f=$('#productForm');Object.entries(p).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v})}
function move(id,delta,note){let p=db.products.find(x=>x.id===id);if(p)p.qty+=delta;db.movements.push({id:uid(),product:id,date:today(),type:'adjust',qty:Math.abs(delta),note})}
function del(k,id){if(!confirm('تأكيد الحذف؟'))return;db[k]=db[k].filter(x=>x.id!==id);save();render(k==='products'?'products':k)}
function renderPeople(kind){let title=kind==='customers'?'العملاء':'الموردون';$('#'+kind).innerHTML=`<h2>${title}</h2><form id="personForm"><h3>إضافة ${title.slice(0,-1)}</h3><div class="row">${field('name','الاسم', 'text',true)}${field('company','المحل / الشركة')}${field('phone','رقم التليفون')}${field('address','العنوان بالتفصيل')}${field('notes','ملاحظات')}</div><button class="btn primary">حفظ</button></form><div class="tablebox"><table><thead><tr><th>الاسم</th><th>المحل / الشركة</th><th>الهاتف</th><th>العنوان</th><th>إجراء</th></tr></thead><tbody>${db[kind].map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.company)}</td><td>${esc(p.phone)}</td><td>${esc(p.address)}</td><td><button class="btn small danger" onclick="del('${kind}','${p.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`;$('#personForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db[kind].push({id:uid(),...f});save();renderPeople(kind)}}
function renderPurchases(){$('#purchases').innerHTML=`<h2>المشتريات</h2><form id="buyForm"><div class="row"><div class="field"><label>المورد</label><select name="party"><option value="">بدون مورد</option>${db.suppliers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div><div class="field"><label>المنتج</label><select name="product" required>${productOptions()}</select></div>${field('qty','الكمية','number',true)}${field('price','سعر الشراء للوحدة','number',true)}${field('paid','المدفوع','number')}${field('date','التاريخ')}</div><button class="btn primary">تسجيل فاتورة شراء</button></form>${table(db.purchases,['date','partyName','productName','qty','price','total','paid','due'])}`;$('#buyForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p=db.products.find(x=>x.id===f.product),q=+f.qty,price=+f.price,total=q*price,paid=+f.paid||0;if(!p||q<=0||price<0||paid>total)return alert('راجع البيانات');p.cost=(p.qty*p.cost+total)/(p.qty+q);p.qty+=q;let s={id:uid(),date:f.date||today(),party:f.party,partyName:db.suppliers.find(x=>x.id===f.party)?.name||'بدون مورد',product:p.id,productName:p.name,qty:q,price,total,paid,due:total-paid};db.purchases.push(s);if(paid)db.cash.push({id:uid(),date:s.date,type:'out',amount:paid,note:'سداد مشتريات'});save();renderPurchases()}}
function renderSales(){$('#sales').innerHTML=`<h2>المبيعات</h2><form id="saleForm"><div class="row"><div class="field"><label>العميل</label><select name="party"><option value="">عميل نقدي</option>${db.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div><div class="field"><label>المنتج</label><select name="product" required>${productOptions()}</select></div><div class="field"><label>نوع السعر</label><select name="priceType"><option value="wholesale">جملة</option><option value="retail">قطاعي</option></select></div>${field('qty','الكمية','number',true)}${field('price','سعر الوحدة (اتركه فارغًا للسعر المختار)','number')}${field('discount','الخصم','number')}${field('paid','المدفوع','number')}${field('date','التاريخ')}</div><button class="btn primary">تسجيل فاتورة بيع</button></form>${table(db.sales,['date','partyName','productName','qty','price','discount','total','paid','due','profit'])}`;$('#saleForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),p=db.products.find(x=>x.id===f.product),q=+f.qty,price=+f.price||(f.priceType==='retail'?p.retail:p.wholesale),discount=+f.discount||0,total=Math.max(0,q*price-discount),paid=+f.paid||0;if(!p||q<=0||p.qty<q||paid>total)return alert('راجع الكمية أو المبلغ المدفوع');let cost=q*p.cost,s={id:uid(),number:'S-'+Date.now(),date:f.date||today(),party:f.party,partyName:db.customers.find(x=>x.id===f.party)?.name||'عميل نقدي',product:p.id,productName:p.name,qty:q,price,discount,total,paid,due:total-paid,cost,profit:total-cost};p.qty-=q;db.sales.push(s);db.invoices.push({...s,activityName:cfg().name,activityPhone:cfg().phone,activityAddress:cfg().address});if(paid)db.cash.push({id:uid(),date:s.date,type:'in',amount:paid,note:'تحصيل فاتورة '+s.number});db.movements.push({id:uid(),product:p.id,date:s.date,type:'sale',qty:q,note:s.number});save();renderSales()}}
function table(rows,cols){return `<div class="tablebox"><table><thead><tr>${cols.map(c=>`<th>${({date:'التاريخ',partyName:'الطرف',productName:'المنتج',qty:'الكمية',price:'السعر',discount:'الخصم',total:'الإجمالي',paid:'المدفوع',due:'المتبقي',profit:'الربح',amount:'القيمة',type:'النوع',note:'ملاحظات'}[c]||c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${['price','discount','total','paid','due','profit','amount'].includes(c)?money(r[c]):esc(r[c]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderExpenses(){$('#expenses').innerHTML=`<h2>المصروفات</h2><form id="expForm"><div class="row">${field('name','نوع المصروف', 'text',true)}${field('amount','القيمة','number',true)}${field('date','التاريخ')}${field('notes','ملاحظات')}</div><button class="btn primary">تسجيل المصروف</button></form>${table(db.expenses,['date','name','amount','notes'])}`;$('#expForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.expenses.push({id:uid(),...f,amount:+f.amount,date:f.date||today()});db.cash.push({id:uid(),date:f.date||today(),type:'out',amount:+f.amount,note:'مصروف: '+f.name});save();renderExpenses()}}
function renderCash(){let ins=db.cash.filter(x=>x.type==='in').reduce((s,x)=>s+x.amount,0),outs=db.cash.filter(x=>x.type==='out').reduce((s,x)=>s+x.amount,0);$('#cash').innerHTML=`<h2>الخزنة والتحصيلات والمدفوعات</h2><div class="grid">${metric('إجمالي الداخل',money(ins))}${metric('إجمالي الخارج',money(outs))}${metric('رصيد الخزنة المسجل',money(ins-outs))}</div><form id="cashForm"><div class="row"><div class="field"><label>نوع الحركة</label><select name="type"><option value="in">قبض</option><option value="out">صرف</option></select></div>${field('amount','القيمة','number',true)}${field('note','البيان')}${field('date','التاريخ')}</div><button class="btn primary">إضافة حركة</button></form>${table(db.cash,['date','type','amount','note'])}`;$('#cashForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.cash.push({id:uid(),...f,amount:+f.amount,date:f.date||today()});save();renderCash()}}
function renderReports(){let s=db.sales.reduce((a,x)=>a+x.total,0),c=db.sales.reduce((a,x)=>a+x.cost,0),ex=db.expenses.reduce((a,x)=>a+x.amount,0),p=db.products.reduce((a,x)=>a+x.qty*x.cost,0);$('#reports').innerHTML=`<h2>التقارير الإجمالية</h2><div class="grid">${metric('المبيعات',money(s))}${metric('تكلفة المبيعات',money(c))}${metric('الربح الإجمالي',money(s-c))}${metric('المصروفات',money(ex))}${metric('صافي الربح التقديري',money(s-c-ex))}${metric('قيمة المخزون',money(p))}${metric('ديون العملاء',money(db.sales.reduce((a,x)=>a+x.due,0)))}${metric('مستحقات الموردين',money(db.purchases.reduce((a,x)=>a+x.due,0)))}</div><div class="card"><h3>أكثر المنتجات مبيعًا</h3>${Object.values(db.sales.reduce((a,x)=>(a[x.productName]=(a[x.productName]||0)+x.qty,a),{})).length?Object.entries(db.sales.reduce((a,x)=>(a[x.productName]=(a[x.productName]||0)+x.qty,a),{})).sort((a,b)=>b[1]-a[1]).map(x=>`<p>${esc(x[0])}: ${x[1]}</p>`).join(''):'لا توجد مبيعات بعد'}</div><div class="card"><h3>الأقل حركة</h3>${db.products.filter(p=>!db.sales.some(s=>s.product===p.id)).map(p=>`<p>${esc(p.name)}</p>`).join('')||'كل المنتجات لها مبيعات أو لا توجد منتجات'}</div>`}
function renderInvoices(){$('#invoices').innerHTML=`<h2>الفواتير</h2><p class="muted">اختر فاتورة لعرضها وطباعتها أو حفظها PDF من نافذة الطباعة.</p><div class="tablebox"><table><thead><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>إجراء</th></tr></thead><tbody>${db.invoices.map(x=>`<tr><td>${x.number}</td><td>${x.date}</td><td>${esc(x.partyName)}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.due)}</td><td><button class="btn small" onclick="printInvoice('${x.id}')">عرض / طباعة</button></td></tr>`).join('')}</tbody></table></div><div id="invoiceView"></div>`}
function printInvoice(id){let x=db.invoices.find(i=>i.id===id);if(!x)return;$('#invoiceView').innerHTML=`<div class="card"><h2>${esc(x.activityName||cfg().name)}</h2><p>${esc(x.activityPhone||'')} — ${esc(x.activityAddress||'')}</p><hr><h3>فاتورة ${x.number}</h3><p>التاريخ: ${x.date} | العميل: ${esc(x.partyName)}</p><table><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr><tr><td>${esc(x.productName)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.total+x.discount)}</td></tr></table><p>الخصم: ${money(x.discount)} | الإجمالي: ${money(x.total)}</p><p>المدفوع: ${money(x.paid)} | المتبقي: ${money(x.due)}</p><p>ملاحظة الضمان: يرجى الرجوع لبيانات المنتج وقت البيع.</p><button class="btn primary no-print" onclick="window.print()">طباعة / PDF</button></div>`;window.scrollTo(0,document.body.scrollHeight)}
function renderSettings(){$('#settings').innerHTML=`<h2>إعدادات النشاط والنسخ الاحتياطي</h2><form id="settingsForm"><div class="row">${field('name','اسم النشاط','text',true)}${field('phone','رقم الهاتف')}${field('address','العنوان')}</div><button class="btn primary">حفظ بيانات النشاط</button></form><div class="card"><h3>الأمان</h3><p class="muted">كلمة المرور الافتراضية أول مرة: 1234. غيّرها فورًا.</p><form id="passForm"><div class="row">${field('old','كلمة المرور الحالية')}${field('next','كلمة المرور الجديدة')}</div><button class="btn">تغيير كلمة المرور</button></form></div><div class="card"><h3>النسخ الاحتياطي</h3><div class="actions"><button class="btn gold" id="backup">تصدير نسخة كاملة JSON</button><label class="btn">استعادة نسخة JSON<input id="restore" type="file" accept=".json" class="hidden"></label><button class="btn" id="csv">تصدير ملف المنتجات CSV</button></div></div><div class="card"><h3>إدارة البيانات</h3><button class="btn danger" id="wipe">مسح جميع البيانات</button></div>`;let f=$('#settingsForm');['name','phone','address'].forEach(k=>f.elements[k].value=cfg()[k]||'');f.onsubmit=e=>{e.preventDefault();Object.assign(cfg(),Object.fromEntries(new FormData(f)));save();alert('تم حفظ بيانات النشاط')};$('#passForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.old!==cfg().password)return alert('كلمة المرور الحالية غير صحيحة');if((v.next||'').length<4)return alert('اجعل كلمة المرور 4 أحرف/أرقام على الأقل');cfg().password=v.next;save();alert('تم تغيير كلمة المرور')};$('#backup').onclick=()=>download('alnesr-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');$('#restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!keys.every(k=>Array.isArray(x[k])))throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متأكد؟'))return;db=x;save();alert('تمت الاستعادة');show('dashboard')}catch{alert('ملف النسخة الاحتياطية غير صالح')}};$('#csv').onclick=()=>download('products.csv','\\ufeff'+['الاسم,الكود,التصنيف,الكمية,التكلفة,الجملة,القطاعي',...db.products.map(p=>[p.name,p.code,p.category,p.qty,p.cost,p.wholesale,p.retail].map(csvq).join(','))].join('\\n'),'text/csv;charset=utf-8');$('#wipe').onclick=()=>{let p=prompt('أدخل كلمة المرور لتأكيد المسح');if(p!==cfg().password)return alert('كلمة المرور غير صحيحة');if(!confirm('تحذير نهائي: سيتم حذف كل المنتجات والفواتير والحسابات. هل أنت متأكد؟'))return;keys.forEach(k=>db[k]=[]);db.settings=[{name:'النسر للتجارة',phone:'',address:'',password:p}];save();show('dashboard')}}
function csvq(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
renderDashboard();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
